<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portal de acceso al Sistema de Turnos de la Dirección General Departamentales Norte">
<meta name="theme-color" content="#0a1a2a">
<title>DGDN · Sistema de Turnos</title>
<style>
  :root {
    --azul-profundo: #0a1a2a;
    --azul-inst: #16324F;
    --azul-comp: #2B4C6F;
    --oro: #B08D57;
    --oro-claro: #D4B77A;
    --blanco: #F6F5F2;
    --gris: #8FA3B8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--blanco);
    background: var(--azul-profundo);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Fondo institucional animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(43, 76, 111, 0.6) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(176, 141, 87, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(22, 50, 79, 0.9) 0%, var(--azul-profundo) 100%);
    z-index: -2;
    animation: bgPulse 18s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    z-index: -1;
    opacity: 0.5;
  }

  @keyframes bgPulse {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  /* ===================== ESCUDO ===================== */
  .escudo-wrap {
    position: relative;
    margin-bottom: 28px;
    animation: floatEscudo 5s ease-in-out infinite, fadeUp 0.9s ease-out both;
  }
  .escudo-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    background: radial-gradient(circle, rgba(176, 141, 87, 0.35) 0%, transparent 70%);
    border-radius: 50%;
    animation: glow 3s ease-in-out infinite alternate;
    z-index: -1;
  }
  .escudo-circulo {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(176, 141, 87, 0.45);
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 0 30px rgba(176,141,87,0.08);
  }
  .escudo-circulo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
    display: block;
  }
  .escudo-circulo.sin-escudo::after {
    content: 'DGDN';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--oro-claro);
  }
  @keyframes floatEscudo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes glow {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.1); }
  }

  /* ===================== TÍTULOS ===================== */
  .hero-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: center;
    text-transform: uppercase;
    color: var(--blanco);
    line-height: 1.2;
    margin-bottom: 8px;
    animation: fadeUp 1s ease-out 0.2s both;
  }
  .hero-title span { color: var(--oro-claro); }

  .hero-sub {
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: var(--gris);
    text-align: center;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 48px;
    animation: fadeUp 1s ease-out 0.35s both;
  }
  .hero-sub::after {
    content: '';
    display: block;
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--oro), transparent);
    margin: 18px auto 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===================== BOTONES ===================== */
  .botones {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
    width: 100%;
    max-width: 920px;
  }
  @media (min-width: 760px) {
    .botones { grid-template-columns: 1fr 1fr; }
  }

  .boton {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 26px 24px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--blanco);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                border-color 0.4s ease,
                box-shadow 0.4s ease,
                background 0.4s ease;
    animation: fadeUp 1s ease-out both;
  }
  .boton:nth-child(1) { animation-delay: 0.55s; }
  .boton:nth-child(2) { animation-delay: 0.75s; }

  .boton::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(176, 141, 87, 0.18) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .boton:hover,
  .boton:focus-visible {
    transform: translateY(-6px);
    border-color: rgba(212, 183, 122, 0.5);
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(212, 183, 122, 0.2);
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .boton:hover::before,
  .boton:focus-visible::before { opacity: 1; }
  .boton:active { transform: translateY(-2px) scale(0.99); }

  .boton-icono {
    flex-shrink: 0;
    width: 60px;
    height: 60px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, rgba(176, 141, 87, 0.25), rgba(176, 141, 87, 0.08));
    border: 1px solid rgba(212, 183, 122, 0.3);
    color: var(--oro-claro);
    transition: transform 0.4s ease, background 0.4s ease;
    position: relative;
    z-index: 1;
  }
  .boton-icono svg { width: 28px; height: 28px; }
  .boton:hover .boton-icono {
    transform: scale(1.08) rotate(-4deg);
    background: linear-gradient(135deg, rgba(176, 141, 87, 0.45), rgba(176, 141, 87, 0.15));
  }

  .boton-contenido { flex: 1; position: relative; z-index: 1; }
  .boton-titulo {
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: var(--blanco);
    line-height: 1.25;
  }
  .boton-desc {
    font-size: 0.85rem;
    color: var(--gris);
    line-height: 1.4;
  }
  .boton-flecha {
    flex-shrink: 0;
    font-size: 1.4rem;
    color: var(--oro-claro);
    transition: transform 0.4s ease;
    position: relative;
    z-index: 1;
  }
  .boton:hover .boton-flecha { transform: translateX(6px); }

  /* ===================== FOOTER ===================== */
  .footer {
    margin-top: 56px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--gris);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    animation: fadeUp 1s ease-out 0.95s both;
  }
  .footer strong { color: var(--oro-claro); font-weight: 600; }

  /* ===================== MOBILE ===================== */
  @media (max-width: 480px) {
    .page { padding: 30px 16px; }
    .escudo-circulo { width: 110px; height: 110px; }
    .boton { padding: 20px 18px; gap: 14px; border-radius: 14px; }
    .boton-icono { width: 50px; height: 50px; border-radius: 12px; }
    .boton-icono svg { width: 24px; height: 24px; }
    .boton-titulo { font-size: 0.92rem; }
    .boton-desc { font-size: 0.78rem; }
    .hero-sub { margin-bottom: 32px; letter-spacing: 1.8px; }
    .footer { margin-top: 40px; font-size: 0.7rem; }
  }

  /* ===================== ACCESIBILIDAD ===================== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
